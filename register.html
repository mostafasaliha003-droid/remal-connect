<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>حسابي | Remal Connect</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-dark: #091016;
            --primary-cyan: #00b4d8;
        }
        body { 
            font-family: 'Cairo', sans-serif; 
            background-color: var(--bg-dark); 
            color: white; 
            overflow-x: hidden;
        }
        
        /* 🚀 خلفية شبكية سينمائية */
        .cyber-grid {
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* 🚀 زجاج احترافي (Glassmorphism) */
        .glass-panel { 
            background: rgba(17, 28, 34, 0.7); 
            backdrop-filter: blur(24px); 
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.05); 
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }
        
        /* 🚀 حقول الإدخال */
        .input-group { position: relative; display: flex; align-items: center; }
        .input-icon-right { position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); color: #64748b; pointer-events: none; transition: 0.3s; }
        .input-action-left { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #64748b; cursor: pointer; transition: 0.3s; padding: 5px; }
        .input-action-left:hover { color: var(--primary-cyan); }
        
        .premium-input { 
            width: 100%; 
            background: rgba(0,0,0,0.4); 
            border: 1px solid rgba(255,255,255,0.1); 
            color: white; 
            padding: 0.875rem 3rem 0.875rem 1rem; 
            border-radius: 0.75rem;
            font-size: 0.875rem; 
            font-weight: 700;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .premium-input.has-action {
            padding-left: 3rem; 
        }
        .premium-input:focus { 
            border-color: var(--primary-cyan); 
            outline: none; 
            box-shadow: 0 0 0 4px rgba(0,180,216,0.1); 
            background: rgba(0,0,0,0.6);
        }
        .premium-input:focus ~ .input-icon-right { color: var(--primary-cyan); }

        /* 🚀 أزرار ناعمة */
        .btn-primary {
            background: var(--primary-cyan);
            color: #091016;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(0,180,216,0.2);
        }
        .btn-primary:hover {
            background: #22d3ee;
            box-shadow: 0 0 30px rgba(0,180,216,0.4);
            transform: translateY(-2px);
        }
        .btn-primary:active { transform: translateY(0) scale(0.98); }

        /* 🚀 تأثيرات التبديل */
        .view-section { display: none; opacity: 0; transition: opacity 0.4s ease, transform 0.4s ease; transform: translateY(10px); }
        .view-section.active { display: block; opacity: 1; transform: translateY(0); }

        #toastMsg { transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); z-index: 9999; }
    </style>
</head>
<body class="cyber-grid min-h-screen flex flex-col relative">
    
    <!-- 🚀 Toast Notification -->
    <div id="toastMsg" class="fixed top-10 left-1/2 -translate-x-1/2 -translate-y-32 opacity-0 bg-[#111c22] text-white px-6 py-3.5 rounded-full font-bold text-sm shadow-[0_20px_50px_rgba(0,0,0,0.8)] border flex items-center gap-3 pointer-events-none">
        <i class="fa-solid fa-circle-check text-xl" id="toastIcon"></i>
        <span id="toastText" class="tracking-wide"></span>
    </div>

    <!-- 🚀 Navbar البسيط للعودة -->
    <header class="absolute top-0 w-full z-50 p-6">
        <a href="index.html" class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-white/5 border border-white/10 text-slate-400 hover:text-white hover:bg-white/10 transition-all text-decoration-none">
            <i class="fa-solid fa-arrow-right"></i>
        </a>
    </header>

    <main class="flex-1 flex items-center justify-center p-4 relative z-10">
        <!-- 🚀 إضاءة خلفية محيطية -->
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[300px] md:w-[500px] h-[300px] md:h-[500px] bg-[#00b4d8] rounded-full blur-[150px] opacity-10 pointer-events-none"></div>

        <div class="w-full max-w-md">
            
            <!-- 🚀 الشعار المركزي -->
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-gradient-to-br from-[#00b4d8] to-[#1f3a40] rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-[0_0_20px_rgba(0,180,216,0.3)] transform rotate-3">
                    <svg class="w-8 h-8 text-white drop-shadow-md" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"></path></svg>
                </div>
                <h1 class="font-black text-3xl tracking-tight text-white mb-1">Remal <span class="text-[#00b4d8]">Connect</span></h1>
                <p class="text-slate-400 text-xs font-bold tracking-widest uppercase">Smart eSIM Portal</p>
            </div>

            <div class="glass-panel p-6 md:p-8 rounded-[2rem] relative overflow-hidden">
                
                <!-- 🌟 شاشة تسجيل الدخول -->
                <div id="loginView" class="view-section active">
                    <h2 class="text-2xl font-black mb-1 text-center text-white">أهلاً بعودتك 👋</h2>
                    <p class="text-slate-400 text-xs text-center mb-6 font-semibold">قم بتسجيل الدخول للوصول لشرائحك وإدارة باقاتك.</p>
                    
                    <form id="loginForm" onsubmit="handleLogin(event)" novalidate>
                        <div class="space-y-4 mb-3">
                            <div class="input-group">
                                <svg class="input-icon-right w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                                <!-- 🔴 استخدام oninput لمسح الفراغات أثناء الكتابة -->
                                <input type="email" id="logEmail" required placeholder="البريد الإلكتروني" class="premium-input" dir="ltr" oninput="this.value = this.value.replace(/\s/g, '')" onblur="this.value = this.value.trim()">
                            </div>
                            
                            <div class="input-group">
                                <svg class="input-icon-right w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                                <input type="password" id="logPassword" required placeholder="كلمة المرور" class="premium-input has-action" dir="ltr">
                                <div class="input-action-left" onclick="togglePassword('logPassword', this)">
                                    <i class="fa-regular fa-eye text-lg"></i>
                                </div>
                            </div>
                        </div>

                        <div class="flex justify-end mb-6">
                            <button type="button" onclick="switchView('forgotPasswordView')" class="text-[11px] font-bold text-slate-400 hover:text-[#00b4d8] bg-transparent border-none cursor-pointer transition-colors">
                                هل نسيت كلمة المرور؟
                            </button>
                        </div>

                        <button type="submit" id="logBtn" class="w-full btn-primary font-black py-3.5 rounded-xl flex justify-center items-center gap-2 border-none cursor-pointer text-sm">
                            تسجيل الدخول <i class="fa-solid fa-arrow-left-to-bracket"></i>
                        </button>
                    </form>
                    
                    <div class="mt-6 text-center border-t border-white/10 pt-5">
                        <p class="text-slate-400 text-xs font-bold">ليس لديك حساب؟ 
                            <button type="button" onclick="switchView('registerView')" class="text-[#00b4d8] hover:text-white transition-colors bg-transparent border-none cursor-pointer">إنشاء حساب جديد</button>
                        </p>
                    </div>
                </div>

                <!-- 🌟 شاشة إنشاء حساب جديد -->
                <div id="registerView" class="view-section">
                    <h2 class="text-2xl font-black mb-1 text-center text-white">حساب جديد ✨</h2>
                    <p class="text-slate-400 text-xs text-center mb-6 font-semibold">انضم لعالم الإنترنت السريع بدون حدود.</p>
                    
                    <form id="registerForm" onsubmit="handleRegister(event)" novalidate>
                        <div class="space-y-4 mb-6">
                            <div class="input-group">
                                <svg class="input-icon-right w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                                <input type="text" id="regName" required placeholder="الاسم الكامل" class="premium-input">
                            </div>
                            <div class="input-group">
                                <svg class="input-icon-right w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                                <!-- 🔴 استخدام oninput لمسح الفراغات أثناء الكتابة لتفادي الخطأ -->
                                <input type="email" id="regEmail" required placeholder="البريد الإلكتروني (لاستلام كود QR)" class="premium-input" dir="ltr" oninput="this.value = this.value.replace(/\s/g, '')" onblur="this.value = this.value.trim()">
                            </div>
                            <div class="input-group">
                                <svg class="input-icon-right w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                                <input type="tel" id="regPhone" placeholder="رقم الواتساب (اختياري)" class="premium-input" dir="ltr">
                            </div>
                            <div class="input-group">
                                <svg class="input-icon-right w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                                <input type="password" id="regPassword" required placeholder="كلمة المرور" class="premium-input has-action" dir="ltr">
                                <div class="input-action-left" onclick="togglePassword('regPassword', this)">
                                    <i class="fa-regular fa-eye text-lg"></i>
                                </div>
                            </div>
                        </div>

                        <button type="submit" id="regBtn" class="w-full btn-primary font-black py-3.5 rounded-xl flex justify-center items-center gap-2 border-none cursor-pointer text-sm">
                            تسجيل حساب جديد <i class="fa-solid fa-user-plus"></i>
                        </button>
                    </form>
                    
                    <div class="mt-6 text-center border-t border-white/10 pt-5">
                        <p class="text-slate-400 text-xs font-bold">لديك حساب بالفعل؟ 
                            <button type="button" onclick="switchView('loginView')" class="text-[#00b4d8] hover:text-white transition-colors bg-transparent border-none cursor-pointer">تسجيل الدخول</button>
                        </p>
                    </div>
                </div>

                <!-- 🌟 شاشة استعادة كلمة المرور -->
                <div id="forgotPasswordView" class="view-section">
                    <button type="button" onclick="switchView('loginView')" class="absolute top-5 right-5 w-8 h-8 bg-white/5 rounded-full flex items-center justify-center text-slate-400 hover:text-white hover:bg-white/10 transition-colors border-none cursor-pointer">
                        <i class="fa-solid fa-arrow-right text-xs"></i>
                    </button>
                    
                    <div class="w-12 h-12 bg-amber-500/10 rounded-full flex items-center justify-center mx-auto mb-4 border border-amber-500/20 text-amber-400">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path></svg>
                    </div>
                    
                    <h2 class="text-xl font-black mb-1 text-center text-white">استعادة كلمة المرور 🔐</h2>
                    <p class="text-slate-400 text-xs text-center mb-6 font-semibold leading-relaxed">أدخل بريدك الإلكتروني المسجل لدينا، وسنرسل لك كلمة مرور مؤقتة للوصول لحسابك فوراً.</p>
                    
                    <form id="forgotForm" onsubmit="handleForgotPassword(event)" novalidate>
                        <div class="input-group mb-6">
                            <svg class="input-icon-right w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                            <!-- 🔴 مسح الفراغات لتجنب الأخطاء -->
                            <input type="email" id="forgotEmail" required placeholder="البريد الإلكتروني" class="premium-input" dir="ltr" oninput="this.value = this.value.replace(/\s/g, '')" onblur="this.value = this.value.trim()">
                        </div>

                        <button type="submit" id="forgotBtn" class="w-full btn-primary font-black py-3.5 rounded-xl flex justify-center items-center gap-2 border-none cursor-pointer text-sm">
                            إرسال كلمة المرور المؤقتة <i class="fa-regular fa-paper-plane"></i>
                        </button>
                    </form>
                </div>

            </div>
        </div>
    </main>

    <script>
        // 🔴 التعديل النهائي الفعال والمثالي
        const API_URL = 'https://remal-connect.onrender.com';

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toastMsg');
            const icon = document.getElementById('toastIcon');
            
            toast.className = 'fixed top-10 left-1/2 -translate-x-1/2 opacity-100 translate-y-0 px-6 py-3.5 rounded-full font-bold text-sm shadow-[0_20px_50px_rgba(0,0,0,0.8)] border flex items-center gap-3 z-[9999] transition-all duration-300';
            
            if (type === 'success') {
                toast.classList.add('bg-emerald-900/90', 'border-emerald-500/50', 'text-emerald-400');
                icon.className = 'fa-solid fa-circle-check text-xl';
            } else if (type === 'error') {
                toast.classList.add('bg-rose-900/90', 'border-rose-500/50', 'text-rose-400');
                icon.className = 'fa-solid fa-circle-xmark text-xl';
            } else {
                toast.classList.add('bg-amber-900/90', 'border-amber-500/50', 'text-amber-400');
                icon.className = 'fa-solid fa-circle-info text-xl';
            }
            
            document.getElementById('toastText').innerHTML = message;
            
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', '-translate-y-32');
            }, 4500);
        }

        function togglePassword(inputId, iconContainer) {
            const input = document.getElementById(inputId);
            const icon = iconContainer.querySelector('i');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
                iconContainer.classList.add('text-[#00b4d8]');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
                iconContainer.classList.remove('text-[#00b4d8]');
            }
        }

        function switchView(viewId) {
            document.querySelectorAll('.view-section').forEach(el => {
                el.classList.remove('active');
            });
            setTimeout(() => {
                document.getElementById(viewId).classList.add('active');
            }, 50); 
        }

        // 🔴 دالة التحقق من صحة الإيميل
        function validateEmail(email) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(email);
        }

        async function handleRegister(e) {
            e.preventDefault();
            const emailInput = document.getElementById('regEmail').value;
            // التحقق قبل الإرسال
            if (!validateEmail(emailInput)) {
                showToast('يرجى إدخال بريد إلكتروني صحيح بدون فراغات', 'error');
                return;
            }

            const btn = document.getElementById('regBtn');
            const originalHtml = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري إنشاء الحساب...';
            btn.disabled = true;

            const fullName = document.getElementById('regName').value.trim();
            const email = emailInput.trim().toLowerCase();
            const whatsapp = document.getElementById('regPhone').value.trim();
            // 🔴 إضافة .trim() لمنع أخطاء المسافات المنسوخة
            const password = document.getElementById('regPassword').value.trim();

            try {
                const fetchUrl = `${API_URL}/api/auth/register`; 
                const res = await fetch(fetchUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fullName, email, whatsapp, password })
                });
                const data = await res.json();

                if (data.success || res.ok) {
                    showToast('تم إنشاء الحساب بنجاح! 🚀 جاري الدخول...', 'success');
                    localStorage.setItem('rimal_current_user', JSON.stringify({ fullName, email, role: 'customer' }));
                    setTimeout(() => window.location.href = 'index.html', 1500);
                } else {
                    if (data.message && data.message.includes('مسجل بالفعل')) {
                        showToast(`هذا البريد مسجل مسبقاً. <button onclick="switchView('loginView')" class="underline bg-transparent border-none text-white cursor-pointer ml-1">سجل دخولك هنا</button>`, 'error');
                    } else {
                        showToast(data.message || data.error || 'حدث خطأ أثناء التسجيل', 'error');
                    }
                }
            } catch (error) {
                console.error("Register Error:", error);
                showToast('خطأ في الاتصال بالخادم. يرجى المحاولة لاحقاً.', 'error');
            } finally {
                btn.innerHTML = originalHtml;
                btn.disabled = false;
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const emailInput = document.getElementById('logEmail').value;
            if (!validateEmail(emailInput)) {
                showToast('يرجى إدخال بريد إلكتروني صحيح بدون فراغات', 'error');
                return;
            }

            const btn = document.getElementById('logBtn');
            const originalHtml = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري التحقق...';
            btn.disabled = true;

            const email = emailInput.trim().toLowerCase();
            // 🔴 إضافة .trim() لمنع أخطاء المسافات المنسوخة
            const password = document.getElementById('logPassword').value.trim();

            try {
                const fetchUrl = `${API_URL}/api/auth/login`;
                const res = await fetch(fetchUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (data.success || res.ok) {
                    showToast('تم تسجيل الدخول بنجاح! 🌍', 'success');
                    localStorage.setItem('rimal_current_user', JSON.stringify(data.user || {email: email}));
                    setTimeout(() => window.location.href = 'index.html', 1000);
                } else {
                    showToast(data.message || data.error || 'بيانات الدخول غير صحيحة', 'error');
                }
            } catch (error) {
                console.error("Login Error:", error);
                showToast('خطأ في الاتصال بالخادم. يرجى المحاولة لاحقاً.', 'error');
            } finally {
                btn.innerHTML = originalHtml;
                btn.disabled = false;
            }
        }

        // 🚀 إرسال طلب كلمة المرور المؤقتة إلى السيرفر
        async function handleForgotPassword(e) {
            e.preventDefault();
            const emailInput = document.getElementById('forgotEmail').value;
            if (!validateEmail(emailInput)) {
                showToast('يرجى إدخال بريد إلكتروني صحيح بدون فراغات', 'error');
                return;
            }

            const btn = document.getElementById('forgotBtn');
            const email = emailInput.trim().toLowerCase();
            const originalHtml = btn.innerHTML;
            
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري المعالجة والإرسال...';
            btn.disabled = true;

            try {
                const fetchUrl = `${API_URL}/api/auth/forgot-password`;
                const res = await fetch(fetchUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                
                const data = await res.json();

                if (data.success || res.ok) {
                    showToast(data.message || 'تم إرسال الرابط بنجاح', 'success');
                    document.getElementById('forgotEmail').value = '';
                    setTimeout(() => switchView('loginView'), 2500);
                } else {
                    showToast(data.message || data.error || 'تعذر العثور على الحساب', 'error');
                }
            } catch (error) {
                console.error("Forgot Password Error:", error);
                showToast('تعذر إتمام العملية. تأكد من اتصالك أو حاول لاحقاً.', 'error');
            } finally {
                btn.innerHTML = originalHtml;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
